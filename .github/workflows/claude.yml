# SECURITY (owner decision 2026-10-09): this is a PUBLIC repo and the job runs
# on a self-hosted home-lab runner (tau-frontierml). Anyone on GitHub can open
# issues or comment, so the job-level `if:` below runs Claude ONLY when the
# triggering content (comment / review / issue) was authored by an OWNER,
# MEMBER or COLLABORATOR, in addition to the existing @claude mention check.
# Everyone else -> the job is skipped and never reaches the runner.
# - Do NOT switch to GitHub-hosted runners (owner policy) and do NOT use
#   pull_request_target.
# - There are no `run:` steps here, so no ${{ github.event.* }} lands in a
#   shell. The action reads the comment body as its prompt, which is why the
#   author must be trusted.
# - `id-token: write` stays: this workflow does not pass github_token, so
#   claude-code-action uses the GitHub OIDC -> Claude App token exchange.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Trusted authors only (see header). author_association is taken from the
    # object that carries the @claude text: comment, review, or issue.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: tau-frontierml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

