# SECURITY (owner decision 2026-10-09): this is a PUBLIC repo and the job runs
# on a self-hosted home-lab runner (tau-frontierml). Anyone on GitHub can open
# issues or comment, so the job-level `if:` below runs Claude ONLY when, in
# addition to the existing @claude mention check, BOTH of these are an OWNER,
# MEMBER or COLLABORATOR:
#   * the author of the triggering content (comment / issue), AND
#   * the author of the issue or PR Claude will read (title, body, diff and
#     files are prompt input and can carry prompt injection).
# The `issues` event also requires a human sender
# (github.event.sender.type == 'User').
# Everyone else -> the job is skipped and never reaches the runner.
# - Only `issue_comment` and `issues` are used. Both always run the workflow
#   file from the DEFAULT branch, so the guard cannot be edited by a PR.
#   `issue_comment` also covers PR conversation comments.
# - pull_request_review / pull_request_review_comment are intentionally NOT
#   used: they run the workflow from the PR's merge ref, so a fork PR could
#   edit this guard away and still reach the self-hosted runner.
# - include_comments_by_actor limits the issue/PR comments, reviews and review
#   comments fed into Claude's prompt to the owner's. Otherwise an outsider's
#   comment on a trusted thread becomes prompt input (prompt injection).
# - Do NOT switch to GitHub-hosted runners (owner policy) and do NOT use
#   pull_request_target.
# - There are no `run:` steps here, so no ${{ github.event.* }} lands in a
#   shell.
# - Actions are pinned to full commit SHAs (version in a trailing comment).
#   Re-resolve from the official tag when bumping.
# - `id-token: write` stays: this workflow does not pass github_token, so
#   claude-code-action uses the GitHub OIDC -> Claude App token exchange.
name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Trusted authors only (see header): the author of the comment / issue
    # that carries @claude AND the author of the issue / PR it is on.
    # issue_comment covers both issues and PRs (github.event.issue is the PR
    # for PR conversation comments).
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        github.event.sender.type == 'User')
    runs-on: tau-frontierml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Only the owner's comments/reviews on the thread reach the prompt
          # (see header). Applies to issue/PR comments, reviews and inline
          # review comments in claude-code-action's context fetcher.
          include_comments_by_actor: 'Beaker12'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

