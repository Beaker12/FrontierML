# SECURITY (owner decision 2026-10-09): this is a PUBLIC repo and the job runs
# on a self-hosted home-lab runner (tau-frontierml). Fork PRs would otherwise
# run on that runner, so the job-level `if:` below runs ONLY for PRs whose head
# branch lives in this repository AND whose author is an OWNER, MEMBER or
# COLLABORATOR. Fork PRs, Dependabot PRs and outside authors are skipped.
# - Do NOT switch to GitHub-hosted runners (owner policy) and do NOT use
#   pull_request_target.
# - For `pull_request`, GitHub uses the workflow file from the PR's merge ref,
#   so a fork PR can edit this guard away. This `if:` is only fully effective
#   together with the repo setting "Require approval for all external
#   contributors" (Settings > Actions > General).
# - No `run:` steps; the only interpolation (`prompt:`) uses
#   github.repository and the numeric PR number, neither of which an
#   attacker controls.
# - `id-token: write` was removed: github_token is passed below, so
#   claude-code-action skips the OIDC exchange. Add it back if github_token
#   is removed.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Trusted, same-repo PRs only (see header).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: tau-frontierml
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bypass claude-code-action's internal GitHub-OIDC -> App-token
          # exchange (broken as of 2026-09-10: GitHub issues a generic,
          # non-ref-bound `sub` claim for pull_request/pull_request_target
          # events — repo:OWNER/REPO:pull_request — that Anthropic's
          # exchange endpoint currently rejects with a 401). GITHUB_TOKEN
          # skips that exchange entirely; comments post as github-actions[bot]
          # instead of the Claude App identity. Bumped pull-requests to
          # write above so GITHUB_TOKEN can actually post them. Revert both
          # once the upstream OIDC validation accepts the pull_request
          # subject again.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowedTools REPLACES claude-code-action's built-in default tool
          # set rather than extending it (confirmed 2026-09-10 on Beaker12/Tenet,
          # commit c7011c8ac: the review ran "success" with permission_denials_count
          # in the double digits and posted nothing). Two things were missing here:
          # (1) `Skill` itself — the prompt below invokes /code-review:code-review,
          #     which issues a `Skill` tool call; without it granted the skill is
          #     denied outright (non_execution_kind: user-rejected) and nothing
          #     downstream ever runs. This was the actual root cause of total
          #     silence, confirmed via show_full_output: true on a throwaway test
          #     PR (Beaker12/fermion-kids#20) — fixed the skill denial, then a real
          #     inline comment posted correctly.
          # (2) Read/Grep/Glob/LS — without them the plugin can see the diff via
          #     `gh pr diff` but can't inspect surrounding source to verify a
          #     finding, and declines to post an unverified one.
          claude_args: >-
            --allowedTools
            "Skill,
            mcp__github_inline_comment__create_inline_comment,
            Read,Grep,Glob,LS,
            Bash(gh pr diff:*),Bash(gh pr view:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

